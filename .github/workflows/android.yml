name: Android build

on:
  push:
    branches: [ "master", "claude/**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Signing is enabled automatically once the secrets exist (see store/SIGNING.md)
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore keystore from secret
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Publish (Release, arm64, trimmed + profiled AOT)
        run: |
          # Play Store needs a higher versionCode for every upload → use the run number
          ARGS="-p:ApplicationVersion=${{ github.run_number }}"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ARGS="$ARGS -p:AndroidKeyStore=true"
            ARGS="$ARGS -p:AndroidSigningKeyStore=$RUNNER_TEMP/upload.keystore"
            ARGS="$ARGS -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS || 'upload' }}"
            ARGS="$ARGS -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD"
            ARGS="$ARGS -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD"
          fi
          dotnet publish FirstApp/FirstApp.csproj -f net10.0-android -c Release -o out \
            -p:AndroidSdkDirectory="$ANDROID_HOME" $ARGS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Report package size
        run: |
          {
            echo "## 📦 Build ${{ github.run_number }}"
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "✅ Signed with your upload key – the \`-Signed.aab\` can be uploaded to Google Play."
            else
              echo "⚠️ Not signed with an upload key (debug key only) – see store/SIGNING.md."
            fi
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/*.apk out/*.aab; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "versionCode: ${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la out

      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: resistor-calculator-${{ github.run_number }}
          path: |
            out/*-Signed.aab
            out/*-Signed.apk

      - name: Upload R8 mapping (for crash reports in Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.run_number }}
          path: out/mapping.txt
          if-no-files-found: ignore
